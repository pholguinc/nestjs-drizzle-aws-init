services:
  # ============================================================================
  # PostgreSQL Service
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: notary-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password_123}
      POSTGRES_DB: ${DB_NAME:-notary_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Redis Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: notary-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_456}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

# ==============================================================================
# Persistent Volumes Definition
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
